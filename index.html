<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redimensionador de Imágenes</title>
    <style>
      :root {
        --bg: #05100c;
        --card: #0f1c16;
        --card2: #1a2a22;
        --accent: #1ce8a0;
        --accent2: #0bb877;
        --text: #e8f5ee;
        --muted: #8ba699;
        --border: #24382e;
        --ok: #1ce8a0;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #05100c 0%, #0a1f16 100%);
        color: var(--text);
        min-height: 100vh;
        padding: 24px;
      }
      .container { max-width: 1100px; margin: 0 auto; }
      header { text-align: center; margin-bottom: 32px; }
      h1 {
        font-size: 2rem;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      header p { color: var(--muted); margin-top: 8px; }
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 24px;
      }
      /* Dropzone */
      #dropzone {
        border: 2px dashed var(--accent);
        border-radius: 12px;
        padding: 40px;
        text-align: center;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s;
      }
      #dropzone.dragover { background: rgba(99, 102, 241, 0.12); border-color: var(--accent2); }
      #dropzone .icon { font-size: 3rem; }
      #dropzone p { color: var(--muted); margin-top: 8px; }
      #dropzone strong { color: var(--text); }
      #fileInput { display: none; }
      .preview-original {
        margin-top: 16px;
        display: none;
        align-items: center;
        gap: 16px;
      }
      .preview-original img {
        max-width: 120px; max-height: 120px;
        border-radius: 8px; border: 1px solid var(--border);
      }
      .preview-original .meta { color: var(--muted); font-size: 0.9rem; }
      /* Sizes */
      h2 { font-size: 1.1rem; margin-bottom: 12px; }
      .sizes-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
      .size-row {
        display: flex; align-items: center; gap: 10px;
        background: var(--card2); padding: 10px 12px; border-radius: 10px;
      }
      .size-row input[type="text"], .size-row input[type="number"] {
        background: #05100c; color: var(--text);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 8px 10px; font-size: 0.9rem;
      }
      .size-row input[type="text"] { flex: 1; min-width: 100px; }
      .size-row input[type="number"] { width: 90px; }
      .size-row .x { color: var(--muted); }
      .size-row .remove {
        margin-left: auto; background: transparent; border: none;
        color: #f87171; cursor: pointer; font-size: 1.2rem; padding: 4px 8px;
      }
      .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      .fmt-check {
        display: flex; align-items: center; gap: 6px;
        background: var(--card2); padding: 8px 14px; border-radius: 10px;
        cursor: pointer; font-size: 0.9rem; user-select: none;
      }
      .fmt-check input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
      button {
        font-family: inherit; font-size: 0.95rem; font-weight: 600;
        border: none; border-radius: 10px; padding: 10px 18px;
        cursor: pointer; transition: transform 0.1s, opacity 0.2s;
      }
      button:active { transform: scale(0.97); }
      .btn-secondary { background: var(--card2); color: var(--text); }
      .btn-primary {
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        color: #04120c; padding: 12px 28px;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .fit-select {
        background: #05100c; color: var(--text);
        border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px;
      }
      label.field { color: var(--muted); font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
      /* Results */
      #status { text-align: center; color: var(--muted); margin: 16px 0; }
      .grid {
        display: grid; gap: 20px;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }
      .result-card {
        background: var(--card); border: 1px solid var(--border);
        border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
      }
      .result-card .imgwrap {
        background: repeating-conic-gradient(#0f1c16 0% 25%, #1a2a22 0% 50%) 50% / 20px 20px;
        display: flex; align-items: center; justify-content: center; min-height: 160px; padding: 8px;
      }
      .result-card img { max-width: 100%; max-height: 200px; border-radius: 6px; }
      .result-card .info { padding: 14px; }
      .result-card .label { font-weight: 600; }
      .result-card .dims { color: var(--muted); font-size: 0.85rem; margin: 4px 0 12px; }
      .downloads { display: flex; flex-wrap: wrap; gap: 8px; }
      .downloads a {
        flex: 1 1 calc(50% - 4px); text-align: center; text-decoration: none;
        font-size: 0.85rem; font-weight: 600; padding: 8px; border-radius: 8px;
        background: var(--card2); color: var(--text); border: 1px solid var(--border);
      }
      .downloads a:hover { border-color: var(--accent); }
      .downloads a .kb { display: block; color: var(--muted); font-weight: 400; font-size: 0.75rem; }
      .spinner {
        width: 28px; height: 28px; border: 3px solid var(--card2);
        border-top-color: var(--accent); border-radius: 50%;
        animation: spin 0.8s linear infinite; margin: 0 auto 8px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 32px; }
      footer a { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Redimensionador de Imágenes</h1>
        <p>Sube una imagen, elige tus tamaños y descárgala en WebP, AVIF, PNG y JPEG optimizados.</p>
      </header>

      <!-- Paso 1: subir -->
      <div class="panel">
        <div id="dropzone">
          <div class="icon">📤</div>
          <p><strong>Arrastra una imagen aquí</strong> o haz clic para elegir</p>
          <p style="font-size: 0.8rem">JPG, PNG, WebP, AVIF, GIF, TIFF — hasta 25 MB</p>
        </div>
        <input type="file" id="fileInput" accept="image/*" />
        <div class="preview-original" id="previewOriginal">
          <img id="originalImg" alt="Original" />
          <div class="meta" id="originalMeta"></div>
        </div>
      </div>

      <!-- Paso 2: tamaños -->
      <div class="panel">
        <h2>Tamaños de salida</h2>
        <div class="sizes-list" id="sizesList"></div>
        <div class="controls">
          <button class="btn-secondary" id="addSize">+ Añadir tamaño</button>
          <button class="btn-secondary" id="resetSizes">Restaurar predefinidos</button>
          <label class="field">
            Ajuste:
            <select class="fit-select" id="fitSelect">
              <option value="cover">Recortar (cover)</option>
              <option value="inside">Ajustar dentro (inside)</option>
              <option value="contain">Contener (contain)</option>
              <option value="fill">Estirar (fill)</option>
            </select>
          </label>
        </div>
      </div>

      <!-- Paso 2b: formatos -->
      <div class="panel">
        <h2>Formatos de salida</h2>
        <div class="controls" id="formatsList">
          <label class="fmt-check"><input type="checkbox" value="webp" checked /> WebP</label>
          <label class="fmt-check"><input type="checkbox" value="avif" checked /> AVIF</label>
          <label class="fmt-check"><input type="checkbox" value="png" checked /> PNG</label>
          <label class="fmt-check"><input type="checkbox" value="jpeg" checked /> JPEG</label>
        </div>
      </div>

      <!-- Paso 3: procesar -->
      <div style="text-align: center; margin-bottom: 24px">
        <button class="btn-primary" id="processBtn" disabled>Redimensionar imagen</button>
      </div>

      <div id="status"></div>
      <div class="grid" id="results"></div>

      <footer>
        Hecho con <a href="https://www.npmjs.com/package/sharp" target="_blank">sharp</a> ·
        Basado en
        <a href="https://github.com/warmachine028/imageresizer" target="_blank">imageresizer</a>
      </footer>
    </div>

    <script>
      const DEFAULT_SIZES = [
        { label: "Ultra Wide 32:9", width: 2560, height: 720 },
        { label: "HD 16:9", width: 1280, height: 720 },
        { label: "Retrato 3:4", width: 1098, height: 1464 },
        { label: "Miniatura", width: 600, height: 338 },
        { label: "Cuadrado 1:1", width: 1080, height: 1080 },
        { label: "Story 9:16", width: 1080, height: 1920 },
      ];

      let selectedFile = null;

      const dropzone = document.getElementById("dropzone");
      const fileInput = document.getElementById("fileInput");
      const sizesList = document.getElementById("sizesList");
      const processBtn = document.getElementById("processBtn");
      const statusEl = document.getElementById("status");
      const resultsEl = document.getElementById("results");
      const previewOriginal = document.getElementById("previewOriginal");
      const originalImg = document.getElementById("originalImg");
      const originalMeta = document.getElementById("originalMeta");

      // ---- Gestión de tamaños ----
      function addSizeRow(size = { label: "", width: "", height: "" }) {
        const row = document.createElement("div");
        row.className = "size-row";
        row.innerHTML = `
          <input type="text" class="s-label" placeholder="Nombre (opcional)" value="${size.label || ""}" />
          <input type="number" class="s-width" placeholder="Ancho" min="1" max="10000" value="${size.width || ""}" />
          <span class="x">×</span>
          <input type="number" class="s-height" placeholder="Alto" min="1" max="10000" value="${size.height || ""}" />
          <button class="remove" title="Eliminar">✕</button>
        `;
        row.querySelector(".remove").addEventListener("click", () => row.remove());
        sizesList.appendChild(row);
      }

      function loadDefaultSizes() {
        sizesList.innerHTML = "";
        DEFAULT_SIZES.forEach(addSizeRow);
      }

      function collectSizes() {
        const rows = [...sizesList.querySelectorAll(".size-row")];
        const sizes = [];
        for (const row of rows) {
          const width = parseInt(row.querySelector(".s-width").value, 10);
          const height = parseInt(row.querySelector(".s-height").value, 10);
          const label = row.querySelector(".s-label").value.trim();
          if (width > 0 && height > 0) {
            sizes.push({ label: label || `${width}x${height}`, width, height });
          }
        }
        return sizes;
      }

      document.getElementById("addSize").addEventListener("click", () => addSizeRow());
      document.getElementById("resetSizes").addEventListener("click", loadDefaultSizes);
      loadDefaultSizes();

      // ---- Selección de archivo ----
      function handleFile(file) {
        if (!file || !file.type.startsWith("image/")) {
          alert("Por favor selecciona un archivo de imagen válido.");
          return;
        }
        selectedFile = file;
        const url = URL.createObjectURL(file);
        originalImg.src = url;
        originalImg.onload = () => {
          originalMeta.innerHTML = `<strong>${file.name}</strong><br>${originalImg.naturalWidth}×${originalImg.naturalHeight}px · ${(file.size / 1024).toFixed(1)} KB`;
        };
        previewOriginal.style.display = "flex";
        processBtn.disabled = false;
      }

      dropzone.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", (e) => handleFile(e.target.files[0]));
      ["dragenter", "dragover"].forEach((ev) =>
        dropzone.addEventListener(ev, (e) => {
          e.preventDefault();
          dropzone.classList.add("dragover");
        })
      );
      ["dragleave", "drop"].forEach((ev) =>
        dropzone.addEventListener(ev, (e) => {
          e.preventDefault();
          dropzone.classList.remove("dragover");
        })
      );
      dropzone.addEventListener("drop", (e) => handleFile(e.dataTransfer.files[0]));

      // ---- Procesar ----
      function slugify(text) {
        return text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "imagen";
      }

      processBtn.addEventListener("click", async () => {
        if (!selectedFile) return;
        const sizes = collectSizes();
        if (sizes.length === 0) {
          alert("Añade al menos un tamaño válido (ancho y alto).");
          return;
        }

        resultsEl.innerHTML = "";
        statusEl.innerHTML = `<div class="spinner"></div>Procesando ${sizes.length} tamaño(s)...`;
        processBtn.disabled = true;

        const formats = [...document.querySelectorAll("#formatsList input:checked")].map(
          (c) => c.value
        );
        if (formats.length === 0) {
          alert("Selecciona al menos un formato de salida.");
          return;
        }

        const formData = new FormData();
        formData.append("image", selectedFile);
        formData.append("sizes", JSON.stringify(sizes));
        formData.append("fit", document.getElementById("fitSelect").value);
        formData.append("formats", JSON.stringify(formats));

        try {
          const res = await fetch("/upload", { method: "POST", body: formData });
          const data = await res.json();
          if (!res.ok) {
            const msg = data.detail ? `${data.error} (${data.detail})` : data.error;
            throw new Error(msg || "Error del servidor");
          }

          statusEl.innerHTML = `Original: ${data.original.width}×${data.original.height}px (${data.original.sizeKB} KB) → ${data.results.length} resultados`;

          const baseName = slugify(selectedFile.name.replace(/\.[^.]+$/, ""));
          for (const r of data.results) {
            if (!r.outputs || r.outputs.length === 0) continue;
            const card = document.createElement("div");
            card.className = "result-card";
            const fileBase = `${baseName}-${r.width}x${r.height}`;
            // Vista previa: usamos el primer formato disponible.
            const previewUri = r.outputs[0].dataUri;
            const downloadLinks = r.outputs
              .map(
                (o) =>
                  `<a href="${o.dataUri}" download="${fileBase}.${o.ext}">${o.format.toUpperCase()}<span class="kb">${o.sizeKB} KB</span></a>`
              )
              .join("");
            card.innerHTML = `
              <div class="imgwrap"><img src="${previewUri}" alt="${r.label}" /></div>
              <div class="info">
                <div class="label">${r.label}</div>
                <div class="dims">${r.width}×${r.height}px</div>
                <div class="downloads">${downloadLinks}</div>
              </div>
            `;
            resultsEl.appendChild(card);
          }
        } catch (err) {
          statusEl.innerHTML = `<span style="color:#f87171">Error: ${err.message}</span>`;
        } finally {
          processBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
